<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Surah Yasin | Dzikir Darussalam</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="yasin-page inner-page">
    <div class="app-top-accent"></div>
    <div class="floating-toggle" onclick="toggleTranslation()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
    </div>

    <main class="content-viewport p-0">
        <div class="main-dzikir-card">
            <div id="surahContent" class="unified-content">
                <!-- Content populated by script.js -->
            </div>
        </div>
    </main>

    <nav class="tab-bar">
        <a href="index.html" class="tab-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Beranda</span>
        </a>
        <a href="dzikir.html" class="tab-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7-7-7M5 12h14"/></svg>
            <span>Dzikir</span>
        </a>
        <a href="yasin.html" class="tab-item active">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
            <span>Yasin</span>
        </a>
        <a href="mulk.html" class="tab-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 6.253v13.257c1.335-2.533 3.783-4.51 6.5-4.51v-13.257c-2.717 0-5.165 1.977-6.5 4.51zM12 6.253c-1.335-2.533-3.783-4.51-6.5-4.51v13.257c2.717 0 5.165 1.977 6.5 4.51z"/></svg>
            <span>Mulk</span>
        </a>
        <a href="rahman.html" class="tab-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
            <span>Rahman</span>
        </a>
    </nav>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('surahContent');
            const item = quranData['Yasin'];
            let html = `
                <div class="surah-header-inner">
                    <h1 class="surah-title-ar">سورة يس</h1>
                    <p class="surah-title-id">Surah Yasin (83 Ayat)</p>
                    <div class="surah-divider">۞</div>
                </div>
                <section class="dzikir-section">
                    <div class="section-content">
                        ${item.verses.map((v) => `
                            <div class="verse-item">
                                <div class="verse-ar">${v.ar}</div>
                                <div class="verse-id">${v.id}</div>
                            </div>
                        `).join('')}
                    </div>
                </section>
            `;
            container.innerHTML = html;
        });
    </script>
</body>
</html>
